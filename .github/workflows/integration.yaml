name: Cross-repository integration

on:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Backend git ref
        required: false
        default: main
        type: string
      user_frontend_ref:
        description: User frontend git ref
        required: false
        default: main
        type: string
      venue_frontend_ref:
        description: Venue frontend git ref
        required: false
        default: main
        type: string
  repository_dispatch:
    types: [eventy-integration]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.client_payload.source_repo || 'manual' }}-${{ github.event.client_payload.ref || github.run_id }}
  cancel-in-progress: true

env:
  BACKEND_REPOSITORY: ${{ github.repository_owner }}/eventy-backend
  USER_FRONTEND_REPOSITORY: ${{ github.repository_owner }}/eventy-user-frontend
  VENUE_FRONTEND_REPOSITORY: ${{ github.repository_owner }}/eventy-venue-frontend
  CHECKOUT_TOKEN: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
  APP_URL: http://127.0.0.1:8080
  AD_SHARE_PUBLIC_URL: http://127.0.0.1:8080
  DB_CONNECTION: sqlite
  DB_DATABASE: database/database.sqlite
  VITE_API_URL: http://127.0.0.1:8080/api
  VITE_API_BASE_URL: http://127.0.0.1:8080/api/v1
  EVENTY_BACKEND_URL: http://127.0.0.1:8080

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve refs
        id: refs
        shell: bash
        env:
          INPUT_BACKEND_REF: ${{ inputs.backend_ref }}
          INPUT_USER_FRONTEND_REF: ${{ inputs.user_frontend_ref }}
          INPUT_VENUE_FRONTEND_REF: ${{ inputs.venue_frontend_ref }}
          PAYLOAD_BACKEND_REF: ${{ github.event.client_payload.backend_ref }}
          PAYLOAD_USER_FRONTEND_REF: ${{ github.event.client_payload.user_frontend_ref }}
          PAYLOAD_VENUE_FRONTEND_REF: ${{ github.event.client_payload.venue_frontend_ref }}
          PAYLOAD_SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
        run: |
          backend_ref="${PAYLOAD_BACKEND_REF:-${INPUT_BACKEND_REF:-main}}"
          user_ref="${PAYLOAD_USER_FRONTEND_REF:-${INPUT_USER_FRONTEND_REF:-main}}"
          venue_ref="${PAYLOAD_VENUE_FRONTEND_REF:-${INPUT_VENUE_FRONTEND_REF:-main}}"

          case "$PAYLOAD_SOURCE_REPO" in
            eventy-backend) backend_ref="${PAYLOAD_REF:-$backend_ref}" ;;
            eventy-user-frontend) user_ref="${PAYLOAD_REF:-$user_ref}" ;;
            eventy-venue-frontend) venue_ref="${PAYLOAD_REF:-$venue_ref}" ;;
          esac

          echo "backend_ref=$backend_ref" >> "$GITHUB_OUTPUT"
          echo "user_frontend_ref=$user_ref" >> "$GITHUB_OUTPUT"
          echo "venue_frontend_ref=$venue_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout eventy-test
        uses: actions/checkout@v4
        with:
          path: eventy-test

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKEND_REPOSITORY }}
          ref: ${{ steps.refs.outputs.backend_ref }}
          token: ${{ env.CHECKOUT_TOKEN }}
          path: eventy-backend

      - name: Checkout user frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.USER_FRONTEND_REPOSITORY }}
          ref: ${{ steps.refs.outputs.user_frontend_ref }}
          token: ${{ env.CHECKOUT_TOKEN }}
          path: eventy-user-frontend

      - name: Checkout venue frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VENUE_FRONTEND_REPOSITORY }}
          ref: ${{ steps.refs.outputs.venue_frontend_ref }}
          token: ${{ env.CHECKOUT_TOKEN }}
          path: eventy-venue-frontend

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, gd, intl, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            eventy-test/package-lock.json
            eventy-user-frontend/package-lock.json
            eventy-venue-frontend/package-lock.json

      - name: Install and prepare backend
        working-directory: eventy-backend
        shell: bash
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate
          touch database/database.sqlite
          php artisan config:clear
          php artisan migrate --force
          php artisan eventy:test-accounts --force
          php artisan route:list --json > /dev/null
          npm install
          npm run build

      - name: Start backend
        working-directory: eventy-backend
        shell: bash
        run: |
          nohup php artisan serve --host=127.0.0.1 --port=8080 > backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for backend readiness
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS "$EVENTY_BACKEND_URL/up" > /dev/null && curl -fsS "$EVENTY_BACKEND_URL/api/v1/venues" > /dev/null; then
              echo "Backend is ready after $attempt attempt(s)."
              exit 0
            fi
            echo "Waiting for backend ($attempt/60)..."
            sleep 2
          done
          echo "Backend failed to become ready."
          cat eventy-backend/backend.log
          exit 1

      - name: Install and build user frontend
        working-directory: eventy-user-frontend
        shell: bash
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

      - name: Install and build venue frontend
        working-directory: eventy-venue-frontend
        shell: bash
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Run HTTP integration tests
        working-directory: eventy-test
        shell: bash
        run: |
          npm ci
          npm run test:integration

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: eventy-backend/backend.log
          if-no-files-found: warn

      - name: Stop backend
        if: always()
        shell: bash
        run: |
          if [ -n "${BACKEND_PID:-}" ]; then
            pkill -P "$BACKEND_PID" 2>/dev/null || true
            kill "$BACKEND_PID" 2>/dev/null || true
          fi
