name: Cross-repository integration

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      source_repo:
        description: Source repository that triggered the run
        required: false
        type: string
      ref:
        description: Source commit ref
        required: false
        type: string
      backend_ref:
        description: Backend git ref
        required: false
        default: main
        type: string
      user_frontend_ref:
        description: User frontend git ref
        required: false
        default: main
        type: string
      venue_frontend_ref:
        description: Venue frontend git ref
        required: false
        default: ai-social-venue-agent
        type: string
  repository_dispatch:
    types: [eventy-integration]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.client_payload.source_repo || github.event.repository.name || 'manual' }}-${{ github.event.client_payload.ref || github.sha || github.run_id }}
  cancel-in-progress: true

env:
  BACKEND_REPOSITORY: ${{ github.repository_owner }}/eventy-backend
  USER_FRONTEND_REPOSITORY: ${{ github.repository_owner }}/eventy-user-frontend
  VENUE_FRONTEND_REPOSITORY: ${{ github.repository_owner }}/eventy-venue-frontend
  CHECKOUT_TOKEN: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
  APP_URL: http://127.0.0.1:8080
  AD_SHARE_PUBLIC_URL: http://127.0.0.1:8080
  DB_CONNECTION: sqlite
  DB_DATABASE: database/database.sqlite
  CACHE_STORE: database
  VITE_API_URL: http://127.0.0.1:8080/api
  VITE_API_BASE_URL: http://127.0.0.1:8080/api/v1
  EVENTY_BACKEND_URL: http://127.0.0.1:8080
  USER_FRONTEND_URL: http://127.0.0.1:4173
  VENUE_FRONTEND_URL: http://127.0.0.1:4174

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve refs
        id: refs
        shell: bash
        env:
          INPUT_SOURCE_REPO: ${{ inputs.source_repo }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_BACKEND_REF: ${{ inputs.backend_ref }}
          INPUT_USER_FRONTEND_REF: ${{ inputs.user_frontend_ref }}
          INPUT_VENUE_FRONTEND_REF: ${{ inputs.venue_frontend_ref }}
          PAYLOAD_BACKEND_REF: ${{ github.event.client_payload.backend_ref }}
          PAYLOAD_USER_FRONTEND_REF: ${{ github.event.client_payload.user_frontend_ref }}
          PAYLOAD_VENUE_FRONTEND_REF: ${{ github.event.client_payload.venue_frontend_ref }}
          PAYLOAD_SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
        run: |
          source_repo="${PAYLOAD_SOURCE_REPO:-${INPUT_SOURCE_REPO:-}}"
          source_ref="${PAYLOAD_REF:-${INPUT_REF:-}}"
          backend_ref="${PAYLOAD_BACKEND_REF:-${INPUT_BACKEND_REF:-main}}"
          user_ref="${PAYLOAD_USER_FRONTEND_REF:-${INPUT_USER_FRONTEND_REF:-main}}"
          venue_ref="${PAYLOAD_VENUE_FRONTEND_REF:-${INPUT_VENUE_FRONTEND_REF:-ai-social-venue-agent}}"

          case "$source_repo" in
            eventy-backend) backend_ref="${source_ref:-$backend_ref}" ;;
            eventy-user-frontend) user_ref="${source_ref:-$user_ref}" ;;
            eventy-venue-frontend) venue_ref="${source_ref:-$venue_ref}" ;;
          esac

          echo "backend_ref=$backend_ref" >> "$GITHUB_OUTPUT"
          echo "user_frontend_ref=$user_ref" >> "$GITHUB_OUTPUT"
          echo "venue_frontend_ref=$venue_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout eventy-test
        uses: actions/checkout@v4
        with:
          path: eventy-test

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKEND_REPOSITORY }}
          ref: ${{ steps.refs.outputs.backend_ref }}
          token: ${{ env.CHECKOUT_TOKEN }}
          path: eventy-backend

      - name: Checkout user frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.USER_FRONTEND_REPOSITORY }}
          ref: ${{ steps.refs.outputs.user_frontend_ref }}
          token: ${{ env.CHECKOUT_TOKEN }}
          path: eventy-user-frontend

      - name: Checkout venue frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VENUE_FRONTEND_REPOSITORY }}
          ref: ${{ steps.refs.outputs.venue_frontend_ref }}
          token: ${{ env.CHECKOUT_TOKEN }}
          path: eventy-venue-frontend

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, gd, intl, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            eventy-test/package-lock.json
            eventy-user-frontend/package-lock.json
            eventy-venue-frontend/package-lock.json

      - name: Install and prepare backend
        working-directory: eventy-backend
        shell: bash
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate
          touch database/database.sqlite
          php artisan config:clear
          php artisan migrate --force
          npm install
          npm run build

      - name: Install eventy-test dependencies
        working-directory: eventy-test
        shell: bash
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install and build user frontend
        working-directory: eventy-user-frontend
        shell: bash
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

      - name: Install and build venue frontend
        working-directory: eventy-venue-frontend
        shell: bash
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

      - name: Run full test suite
        working-directory: eventy-test
        shell: bash
        run: |
          mkdir -p report
          set -o pipefail
          npm test 2>&1 | tee report/full-test-output.log

      - name: Seed integration data
        working-directory: eventy-backend
        shell: bash
        run: |
          set -o pipefail
          {
            php artisan db:seed --force
            php artisan eventy:test-accounts --force
            php artisan route:list --json > /dev/null
          } 2>&1 | tee ../eventy-test/report/seed-output.log

      - name: Verify database schema
        working-directory: eventy-test
        shell: bash
        run: npm run test:schema

      - name: Start backend
        working-directory: eventy-backend
        shell: bash
        env:
          CACHE_STORE: 'null'
        run: |
          nohup php artisan serve --host=127.0.0.1 --port=8080 > backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for backend readiness
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS "$EVENTY_BACKEND_URL/up" > /dev/null && curl -fsS "$EVENTY_BACKEND_URL/api/v1/venues" > /dev/null; then
              echo "Backend is ready after $attempt attempt(s)."
              exit 0
            fi
            echo "Waiting for backend ($attempt/60)..."
            sleep 2
          done
          echo "Backend failed to become ready."
          cat eventy-backend/backend.log
          exit 1

      - name: Start user frontend preview
        working-directory: eventy-user-frontend
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          echo "USER_PREVIEW_PID=$!" >> "$GITHUB_ENV"

      - name: Start venue frontend preview
        working-directory: eventy-venue-frontend
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4174 --strictPort > preview.log 2>&1 &
          echo "VENUE_PREVIEW_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for frontend previews
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "$USER_FRONTEND_URL" > /dev/null && curl -fsS "$VENUE_FRONTEND_URL" > /dev/null; then
              echo "Frontend previews are ready after $attempt attempt(s)."
              exit 0
            fi
            echo "Waiting for frontend previews ($attempt/30)..."
            sleep 2
          done
          echo "Frontend previews failed to become ready."
          cat eventy-user-frontend/preview.log
          cat eventy-venue-frontend/preview.log
          exit 1

      - name: Run HTTP integration tests
        working-directory: eventy-test
        shell: bash
        run: npm run test:integration

      - name: Run browser E2E tests
        working-directory: eventy-test
        shell: bash
        run: npm run test:e2e

      - name: Upload full test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-output
          path: eventy-test/report/full-test-output.log
          if-no-files-found: warn

      - name: Upload seed log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-output
          path: eventy-test/report/seed-output.log
          if-no-files-found: warn

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: eventy-backend/backend.log
          if-no-files-found: warn

      - name: Upload frontend preview logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-preview-logs
          path: |
            eventy-user-frontend/preview.log
            eventy-venue-frontend/preview.log
          if-no-files-found: warn

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            eventy-test/playwright-report/
            eventy-test/test-results/
          if-no-files-found: warn

      - name: Stop backend and frontend previews
        if: always()
        shell: bash
        run: |
          for pid in "${BACKEND_PID:-}" "${USER_PREVIEW_PID:-}" "${VENUE_PREVIEW_PID:-}"; do
            if [ -n "$pid" ]; then
              pkill -P "$pid" 2>/dev/null || true
              kill "$pid" 2>/dev/null || true
            fi
          done

          pkill -f "[v]ite preview --host 127.0.0.1 --port 4173 --strictPort" 2>/dev/null || true
          pkill -f "[v]ite preview --host 127.0.0.1 --port 4174 --strictPort" 2>/dev/null || true
